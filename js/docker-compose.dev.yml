services:
  # Client Application (Development)
  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile.dev
    container_name: ds-builder-client-dev
    restart: unless-stopped
    environment:
      VITE_API_GATEWAY_URL: http://localhost:8080
      VITE_CLIENT_ID: dsbuilder-api
      # Источник палитры темы: api (ds-service, по умолчанию) или local (браузер, без сервера)
      VITE_PALETTE_SOURCE: api
      VITE_COMPOSE_PREVIEW_PLUGIN_URL: ${VITE_COMPOSE_PREVIEW_PLUGIN_URL:-http://localhost:8081/}
      VITE_COMPONENT_EDITOR_ENABLED: ${VITE_COMPONENT_EDITOR_ENABLED:-true}
    ports:
      - "3002:5173"
    networks:
      - ds-builder-network
    volumes:
      - ./apps/client:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

networks:
  ds-builder-network:
    driver: bridge
