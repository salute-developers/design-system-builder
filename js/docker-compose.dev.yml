services:
  # Client Application (Development)
  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile.dev
    container_name: ds-builder-client-dev
    restart: unless-stopped
    environment:
      VITE_API_GATEWAY_URL: http://localhost:8080
      VITE_CLIENT_ID: dsbuilder-api
      # Источник палитры темы: api (ds-service, по умолчанию) или local (браузер, без сервера)
      VITE_PALETTE_SOURCE: api
      # Empty by default: the client asks the backend for the active plugin build (published by publish-preview-plugin.sh).
      # A direct address overrides it, for example the dev server of the plugin at http://localhost:8081/.
      VITE_COMPOSE_PREVIEW_PLUGIN_URL: ${VITE_COMPOSE_PREVIEW_PLUGIN_URL:-}
      VITE_COMPONENT_EDITOR_ENABLED: ${VITE_COMPONENT_EDITOR_ENABLED:-true}
      # Empty by default: the client asks the backend for the active web plugin build (published by setup-local.sh
      # from local-dev/web-preview). A direct address overrides it while working on the plugin itself, for example
      # http://localhost:3011/ of `npm run build && npm run preview` in apps/preview-web-plugin.
      VITE_WEB_PREVIEW_PLUGIN_URL: ${VITE_WEB_PREVIEW_PLUGIN_URL:-}
    ports:
      - "3002:5173"
    networks:
      - ds-builder-network
    volumes:
      - ./apps/client:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

networks:
  ds-builder-network:
    driver: bridge
