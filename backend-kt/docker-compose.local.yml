services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8090:8080"
    volumes:
      - ./identity-gateway/keycloak/dsbuilder-realm.json:/opt/keycloak/data/import/dsbuilder-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3; grep -q '200' <&3"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 10

  auth-helper:
    image: ${AUTH_HELPER_IMAGE:-auth-helper:dev}
    build:
      context: ./identity-gateway/app
      dockerfile: Dockerfile.local
    environment:
      AUTH_HELPER_PORT: 8091
      KEYCLOAK_ISSUER: http://localhost:8080/realms/dsbuilder
      KEYCLOAK_AUDIENCE: dsbuilder-api
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/dsbuilder/protocol/openid-connect/certs
      PROJECT_ACCESS_MODE: ${PROJECT_ACCESS_MODE:-http}
      PROJECT_ACCESS_DEFAULT_ROLE: ${PROJECT_ACCESS_DEFAULT_ROLE:-viewer}
      PROJECTS_SERVICE_URL: ${PROJECTS_SERVICE_URL:-http://projects-service:8082}
      PROJECT_ACCESS_TIMEOUT_MS: 1500
      PROJECTS_INTERNAL_API_KEY: ${PROJECTS_INTERNAL_API_KEY:-local-projects-internal-key}
    ports:
      - "8091:8091"
    depends_on:
      keycloak:
        condition: service_healthy
      projects-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  gateway:
    image: nginx:1.27-alpine
    environment:
      DOCUMENTATION_SERVICE_UPSTREAM_SCHEME: http
      DOCUMENTATION_SERVICE_UPSTREAM_HOST: documentation-service
      DOCUMENTATION_SERVICE_UPSTREAM_PORT: 8084
      DOCUMENTATION_MAX_REQUEST_SIZE: 101m
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./identity-gateway/gateway/nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-helper:
        condition: service_healthy
      projects-service:
        condition: service_healthy
      documentation-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  projects-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: projects_service
      POSTGRES_USER: projects
      POSTGRES_PASSWORD: projects
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projects -d projects_service"]
      interval: 10s
      timeout: 5s
      retries: 10

  projects-service:
    image: ${PROJECTS_SERVICE_IMAGE:-projects-service:dev}
    build:
      context: ./projects-service/app
      dockerfile: Dockerfile.local
    environment:
      PROJECTS_SERVICE_PORT: 8082
      PROJECTS_DATABASE_URL: jdbc:postgresql://projects-db:5432/projects_service
      PROJECTS_POSTGRES_USER: projects
      PROJECTS_POSTGRES_PASSWORD: projects
      PROJECTS_INTERNAL_API_KEY: ${PROJECTS_INTERNAL_API_KEY:-local-projects-internal-key}
      PROJECTS_IDENTITY_KEYCLOAK_BASE_URL: ${PROJECTS_IDENTITY_KEYCLOAK_BASE_URL:-http://keycloak:8080}
      PROJECTS_IDENTITY_KEYCLOAK_REALM: ${PROJECTS_IDENTITY_KEYCLOAK_REALM:-dsbuilder}
      PROJECTS_IDENTITY_KEYCLOAK_CLIENT_ID: ${PROJECTS_IDENTITY_KEYCLOAK_CLIENT_ID:-projects-service}
      PROJECTS_IDENTITY_KEYCLOAK_CLIENT_SECRET: ${PROJECTS_IDENTITY_KEYCLOAK_CLIENT_SECRET:-projects-service-secret}
    expose:
      - "8082"
    depends_on:
      projects-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  documentation-db:
    image: postgres:16-alpine
#    Удалить
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: documentation_service
      POSTGRES_USER: documentation
      POSTGRES_PASSWORD: documentation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documentation -d documentation_service"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 minio minio123 && mc mb --ignore-existing local/documentation-bundles"]
    depends_on:
      minio:
        condition: service_healthy

  documentation-service:
    build:
      context: ./documentation-service/app
      dockerfile: Dockerfile.local
    environment:
      DOCUMENTATION_SERVICE_PORT: 8084
      DOCUMENTATION_DATABASE_URL: jdbc:postgresql://documentation-db:5432/documentation_service
      DOCUMENTATION_POSTGRES_USER: documentation
      DOCUMENTATION_POSTGRES_PASSWORD: documentation
      DB_SERVICE_BASE_URL: http://host.docker.internal:3008
      DOCUMENTATION_TEMP_DIRECTORY: /var/tmp/documentation
      DOCUMENTATION_S3_ENDPOINT: http://minio:9000
      DOCUMENTATION_S3_REGION: us-east-1
      DOCUMENTATION_S3_BUCKET: documentation-bundles
      DOCUMENTATION_S3_ACCESS_KEY: minio
      DOCUMENTATION_S3_SECRET_KEY: minio123
      DOCUMENTATION_S3_PATH_STYLE_ACCESS: "true"
      DOCUMENTATION_S3_PREFIX: raw
      DOCUMENTATION_PUBLICATION_S3_PREFIX: ""
      DOCUMENTATION_WORKER_ENABLED: "true"
      DOCUMENTATION_WORKER_POLLING_MS: 1000
      DOCUMENTATION_WORKER_LEASE_SECONDS: 60
      DOCUMENTATION_WORKER_HEARTBEAT_SECONDS: 20
      DOCUMENTATION_WORKER_MAX_ATTEMPTS: 3
      DOCUMENTATION_MAX_COMPRESSED_BYTES: 104857600
      DOCUMENTATION_MAX_UNCOMPRESSED_BYTES: 524288000
      DOCUMENTATION_MAX_ENTRY_BYTES: 104857600
      DOCUMENTATION_MAX_ENTRIES: 20000
      DOCUMENTATION_MAX_PATH_BYTES: 255
      DOCUMENTATION_MAX_MANIFEST_BYTES: 1048576
      DOCUMENTATION_MAX_NAVIGATION_NODES: 10000
      DOCUMENTATION_MAX_NAVIGATION_DEPTH: 32
      DOCUMENTATION_MAX_PAGES: 5000
      DOCUMENTATION_MAX_CONTENT_FILES: 10000
      DOCUMENTATION_MAX_STRING_BYTES: 65536
      DOCUMENTATION_CHUNK_TARGET_BYTES: 12000
      DOCUMENTATION_CHUNK_MAX_BYTES: 24000
      DOCUMENTATION_PAGINATION_DEFAULT_LIMIT: 20
      DOCUMENTATION_PAGINATION_MAX_LIMIT: 100
      DOCUMENTATION_SEARCH_MAX_QUERY_BYTES: 1024
      DOCUMENTATION_SEARCH_MAX_SUBJECTS: 50
    expose:
      - "8084"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      documentation-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
