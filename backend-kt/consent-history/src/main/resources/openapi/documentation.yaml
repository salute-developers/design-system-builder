openapi: 3.0.3
info:
  title: DS Builder — решения об аналитике
  version: 1.0.0
paths:
  /api/privacy/analytics/consent:
    parameters:
      - in: header
        name: X-Consent-Key
        required: true
        description: Случайный отдельный 256-битный ключ; не JWT и не ClientID Метрики.
        schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    get:
      operationId: readAnalyticsConsent
      parameters:
        - in: query
          name: client_group
          required: true
          schema: { type: string, enum: [web, cli_mcp] }
      responses:
        '200':
          description: Действующее уведомление и своё последнее решение; Cache-Control no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentResponse' }
        '400': { description: Некорректная группа }
        '401': { description: Некорректный ключ }
        '429': { description: Превышена частота }
        '503': { description: БД недоступна }
    post:
      operationId: recordAnalyticsConsent
      requestBody:
        required: true
        description: Не более 4096 байт.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentDecision' }
      responses:
        '201':
          description: Новая квитанция после COMMIT и текущее состояние.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentResponse' }
        '200':
          description: Идемпотентный повтор с исходной квитанцией и текущим состоянием.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentResponse' }
        '400': { description: Неверное тело запроса }
        '401': { description: Некорректный ключ }
        '409': { description: Конфликт ревизии, request_id или редакции уведомления }
        '413': { description: Превышен размер }
        '429': { description: Превышена частота }
        '503': { description: БД недоступна; при потере ответа повторить request_id }
components:
  schemas:
    ConsentDecision:
      type: object
      additionalProperties: false
      required: [request_id, client_group, decision, expected_revision]
      description: Для granted обязательны policy_version и policy_sha256; для отрицательного решения они отсутствуют или null.
      properties:
        request_id: { type: string, format: uuid }
        client_group: { type: string, enum: [web, cli_mcp] }
        decision: { type: string, enum: [granted, denied, withdrawn] }
        expected_revision: { type: integer, format: int64, minimum: 0, maximum: 9223372036854775806 }
        policy_version: { type: string, nullable: true }
        policy_sha256: { type: string, pattern: '^[a-f0-9]{64}$', nullable: true }
        app_version: { type: string, maxLength: 64, nullable: true }
    Receipt:
      type: object
      required: [revision, request_id, decision, policy_version, policy_sha256, received_at]
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
        request_id: { type: string, format: uuid }
        decision: { type: string, enum: [granted, denied, withdrawn] }
        policy_version: { type: string }
        policy_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        received_at: { type: string, format: date-time }
        app_version: { type: string, nullable: true }
    ConsentResponse:
      type: object
      required: [policy, current]
      properties:
        policy:
          type: object
          required: [version, sha256, text]
          properties:
            version: { type: string }
            sha256: { type: string }
            text: { type: string }
        current:
          type: object
          required: [revision, analytics_allowed, receipt]
          properties:
            revision: { type: integer, format: int64, minimum: 0 }
            analytics_allowed: { type: boolean }
            receipt:
              nullable: true
              allOf: [{ $ref: '#/components/schemas/Receipt' }]
        receipt:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Receipt' }]
