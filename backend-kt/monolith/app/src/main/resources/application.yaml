ktor:
  application:
    modules:
      - com.dsbuilder.monolith.ApplicationKt.module
  deployment:
    host: "$MONOLITH_HOST:0.0.0.0"
    port: "$MONOLITH_INTERNAL_PORT:8081"

auth:
  keycloak:
    issuer: "$KEYCLOAK_ISSUER:http://localhost:8090/realms/dsbuilder"
    audience: "$KEYCLOAK_AUDIENCE:dsbuilder-api"
    jwksUrl: "$KEYCLOAK_JWKS_URL:http://localhost:8090/realms/dsbuilder/protocol/openid-connect/certs"
  projectAccess:
    mode: in-process

database:
  url: "$PROJECTS_DATABASE_URL:jdbc:postgresql://localhost:5434/projects_service"
  username: "$PROJECTS_POSTGRES_USER:projects"
  password: "$PROJECTS_POSTGRES_PASSWORD:projects"

projects:
  accessKeys:
    keyPrefix: "$PROJECTS_ACCESS_KEYS_PREFIX:dsb_pk"
    defaultTtlMs: "$PROJECTS_ACCESS_KEYS_DEFAULT_TTL_MS:2592000000"
    secretByteLength: "$PROJECTS_ACCESS_KEYS_SECRET_BYTE_LENGTH:32"
    availableScopes:
      - projects:read
      - members:read
      - design-systems:read
      - design-systems:write
      - design-systems:delete
      - tenants:read
      - tenants:write
      - tenants:delete
      - tenants:subthemes:read
      - tenants:subthemes:write
      - tenants:subthemes:delete
      - tokens:read
      - tokens:write
      - tokens:delete
      - tokens:group:read
      - tokens:group:write
      - tokens:group:delete
      - tokens:subgroup:read
      - tokens:subgroup:write
      - tokens:subgroup:delete
      - components:read
      - components:write
      - components:delete
      - components:variations:read
      - components:variations:write
      - components:variations:delete
    hashing:
      iterations: "$PROJECTS_ACCESS_KEYS_HASH_ITERATIONS:120000"
      keyLengthBits: "$PROJECTS_ACCESS_KEYS_HASH_KEY_LENGTH_BITS:256"
      saltByteLength: "$PROJECTS_ACCESS_KEYS_HASH_SALT_BYTE_LENGTH:16"
  identity:
    keycloak:
      baseUrl: "$PROJECTS_IDENTITY_KEYCLOAK_BASE_URL:http://localhost:8090"
      realm: "$PROJECTS_IDENTITY_KEYCLOAK_REALM:dsbuilder"
      clientId: "$PROJECTS_IDENTITY_KEYCLOAK_CLIENT_ID:projects-service"
      clientSecret: "$PROJECTS_IDENTITY_KEYCLOAK_CLIENT_SECRET:projects-service-secret"
      timeoutMs: "$PROJECTS_IDENTITY_KEYCLOAK_TIMEOUT_MS:1500"

documentation:
  database:
    url: "$DOCUMENTATION_DATABASE_URL:jdbc:postgresql://localhost:5434/documentation_service"
  dbService:
    baseUrl: "$DB_SERVICE_BASE_URL:http://127.0.0.1:3008"
  worker:
    enabled: "$DOCUMENTATION_WORKER_ENABLED:false"

integrations:
  dbService:
    baseUrl: "$DB_SERVICE_BASE_URL:http://127.0.0.1:3008"
