name: Validate JavaScript

on:
  pull_request:
    paths:
      - 'js/**'
      - 'frontend-kt/core-*/**'
      - 'frontend-kt/feature-*/**'
      - 'frontend-kt/plugins/figma-core/**'
      - 'frontend-kt/build-system/**'
      - 'frontend-kt/gradle/**'
      - 'frontend-kt/kotlin-js-store/**'
      - 'frontend-kt/*.kts'
      - 'frontend-kt/gradle.properties'
      - 'frontend-kt/gradlew'
      - 'backend-kt/preview/contract/**'
      - '.github/actions/prepare-environment/**'
      - '.github/workflows/validate-js.yml'
  push:
    branches:
      - dev
      - master
    paths:
      - 'js/**'
      - 'frontend-kt/core-*/**'
      - 'frontend-kt/feature-*/**'
      - 'frontend-kt/plugins/figma-core/**'
      - 'frontend-kt/build-system/**'
      - 'frontend-kt/gradle/**'
      - 'frontend-kt/kotlin-js-store/**'
      - 'frontend-kt/*.kts'
      - 'frontend-kt/gradle.properties'
      - 'frontend-kt/gradlew'
      - 'backend-kt/preview/contract/**'
      - '.github/actions/prepare-environment/**'
      - '.github/workflows/validate-js.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Analysis
    if: ${{ false }} # Temporarily disabled until the JS analysis configuration is fixed.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci --no-progress
      - name: ESLint
        run: >-
          npm exec -- eslint
          "apps/client/src/**/*.{ts,tsx}"

  cli:
    name: Typecheck and tests (cli)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: js/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: js/cli/package-lock.json
      - run: npm ci --no-progress
      - run: npm run typecheck
      - run: npm test

  tests-client:
    name: Tests (client)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: js/apps/client/package-lock.json
      - run: npm ci --no-progress
        working-directory: js/apps/client
      # Схема и общие фикстуры Preview Protocol читаются из backend-kt/preview/contract.
      - run: npm test
        working-directory: js/apps/client

  contract-fingerprint:
    name: Contract fingerprint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # CONTRACT.sha256 читает CI plasma-android: он должен соответствовать схеме и общим фикстурам.
      - run: backend-kt/preview/contract/fingerprint.sh --check

  figma-plugin:
    name: Tests and build (figma-plugin)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: js/apps/figma-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: js/apps/figma-plugin/package-lock.json
      # Окно плагина встраивает Kotlin/JS из frontend-kt.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-progress
      - run: npm run core:build
      - run: npm test
      - run: npm run build

  build:
    name: Build (${{ matrix.project.name }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: client
            directory: js/apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: ${{ matrix.project.directory }}/package-lock.json
      - run: npm ci --no-progress
        working-directory: ${{ matrix.project.directory }}
      - run: npm run build
        working-directory: ${{ matrix.project.directory }}
