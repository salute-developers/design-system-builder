name: Publish tokens plugin release

# Архивы плагина DS Builder Tokens для Figma и Pixso в GitHub Release. Релиз не становится Latest: ссылку
# releases/latest использует установщик CLI.
on:
  push:
    tags:
      - 'tokens-plugin-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example tokens-plugin-v0.1.0'
        required: true

permissions:
  contents: read

concurrency:
  # Своя очередь у каждого тега: быстрые теги подряд не вытесняют друг друга.
  group: publish-tokens-plugin-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PLUGIN_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: js/apps/figma-plugin
    steps:
      - name: Require the selected release tag
        working-directory: .
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "$PLUGIN_RELEASE_TAG" ]]; then
            echo 'Run this workflow on the existing release tag, with the same tag in the input' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PLUGIN_RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: js/apps/figma-plugin/package-lock.json
      # Окно плагина встраивает Kotlin/JS из frontend-kt.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check that the tag matches the plugin version
        run: node scripts/release-archive.mjs version "$PLUGIN_RELEASE_TAG"
      - run: npm ci --no-progress
      - name: Build for Figma with the production gateway
        run: npm run build
      - run: npm test
      - name: Pack the Figma archive
        run: node scripts/release-archive.mjs figma "$PLUGIN_RELEASE_TAG" release
      # Сборка Pixso пересобирает окно с адресом шлюза Yandex Cloud, поэтому идёт после архива Figma.
      - name: Build and pack for Pixso with the Yandex Cloud gateway
        run: |
          npm run build:pixso:yandex
          node scripts/release-archive.mjs pixso "$PLUGIN_RELEASE_TAG" release
      - name: Write checksums
        working-directory: js/apps/figma-plugin/release
        run: sha256sum -- *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tokens-plugin-release
          path: |
            js/apps/figma-plugin/release/*.zip
            js/apps/figma-plugin/release/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tokens-plugin-release
          path: release
      - name: Verify the checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Create or update the GitHub release without marking it Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version="${PLUGIN_RELEASE_TAG#tokens-plugin-v}"
          if gh release view "$PLUGIN_RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$PLUGIN_RELEASE_TAG" release/* --clobber
          else
            cat > notes.md <<EOF
          Плагин DS Builder Tokens $version для Figma и Pixso.

          - \`ds-builder-tokens-figma-$version.zip\` — для приложения Figma на компьютере: Plugins → Development → Import plugin from manifest.
          - \`ds-builder-tokens-pixso-$version.zip\` — для Pixso: «Плагины» → «Develop a plugin» → «Upload a plugin». Работает и в сетях, где закрыт домен design-system-builder.ru.

          Подробная инструкция лежит в README.txt внутри архива.
          EOF
            gh release create "$PLUGIN_RELEASE_TAG" release/* --verify-tag --latest=false \
              --title "DS Builder Tokens $version" --notes-file notes.md
          fi
