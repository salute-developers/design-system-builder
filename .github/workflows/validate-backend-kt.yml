name: Validate Kotlin backend

on:
  pull_request:
    paths:
      - 'backend-kt/**'
      - '.github/workflows/validate-backend-kt.yml'
  push:
    branches:
      - dev
      - master
    paths:
      - 'backend-kt/**'
      - '.github/workflows/validate-backend-kt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Backend validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Keycloak bootstrap contract
        run: python3 -m unittest discover -s backend-kt/identity-gateway/keycloak -p 'test_bootstrap.py' -v
      - name: Verify all backend modules and builds
        if: ${{ !cancelled() }}
        run: ./gradlew --init-script ci/test-logging.init.gradle verifyFull --continue --stacktrace
        working-directory: backend-kt
      - name: Upload backend test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.run_attempt }}
          path: |
            backend-kt/**/build/test-results/**/*.xml
            backend-kt/**/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 7
