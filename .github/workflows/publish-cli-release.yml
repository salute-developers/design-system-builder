name: Publish CLI release

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example cli-v0.1.0'
        required: true

permissions:
  contents: read

concurrency:
  group: publish-cli-release
  cancel-in-progress: false

env:
  CLI_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Require the selected release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "$CLI_RELEASE_TAG" ]]; then
            echo 'Run this workflow on the existing release tag, with the same tag in the input' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Validate and check out the exact tag
        shell: bash
        run: |
          python3 frontend-kt/cli/distribution/release.py version --tag "$CLI_RELEASE_TAG"
          git fetch origin "+refs/tags/$CLI_RELEASE_TAG:refs/tags/$CLI_RELEASE_TAG"
          git checkout --detach "refs/tags/$CLI_RELEASE_TAG"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure wget for installer HTTPS contract tests
        run: brew list wget >/dev/null 2>&1 || brew install wget
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download the pinned macOS arm64 iOS CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ios_tag=$(cat frontend-kt/cli/distribution/ios-cli-release.txt)
          if [[ ! "$ios_tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ || "$ios_tag" == current ]]; then
            echo 'Set an exact plasma-ios release tag in cli/distribution/ios-cli-release.txt' >&2
            exit 1
          fi
          asset="dsbuilder-ios-cli-$ios_tag.zip"
          archive="frontend-kt/cli/build/ios-cli/$asset"
          digest=$(gh api "repos/salute-developers/plasma-ios/releases/tags/$ios_tag" \
            --jq ".assets[] | select(.name == \"$asset\") | .digest")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Missing SHA-256 digest for $asset" >&2
            exit 1
          fi
          mkdir -p "$(dirname "$archive")"
          gh release download "$ios_tag" --repo salute-developers/plasma-ios \
            --pattern "$asset" --dir "$(dirname "$archive")"
          printf '%s  %s\n' "${digest#sha256:}" "$archive" | shasum -a 256 -c -
          unzip -p "$archive" dsbuilder-ios-cli/dsbuilder-ios > "$RUNNER_TEMP/dsbuilder-ios"
          test "$(lipo -archs "$RUNNER_TEMP/dsbuilder-ios")" = arm64
      - name: Build and check web generator package
        working-directory: js/cli
        run: |
          npm ci --no-progress
          npm run typecheck
          npm test
          npm pack --dry-run
          sh scripts/check-global-install.sh
          mkdir -p ../../npm-artifacts
          npm pack --ignore-scripts --pack-destination ../../npm-artifacts
          mv ../../npm-artifacts/*.tgz ../../npm-artifacts/dsbuilder-web-generator.tgz
          (cd ../../npm-artifacts && shasum -a 256 dsbuilder-web-generator.tgz > generator.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: cli-npm-generator
          path: npm-artifacts/
          if-no-files-found: error
      - name: Build and check distributions
        working-directory: frontend-kt
        env:
          DSBUILDER_ANALYTICS_ENABLED: ${{ vars.DSBUILDER_ANALYTICS_ENABLED_PROM || 'false' }}
          DSBUILDER_METRICA_COUNTER_ID: ${{ vars.DSBUILDER_METRICA_COUNTER_ID_PROM }}
          DSBUILDER_METRICA_BASE_URL: ${{ vars.DSBUILDER_METRICA_BASE_URL_PROM }}
          DSBUILDER_METRICA_CLI_TOKEN: ${{ secrets.DSBUILDER_METRICA_CLI_TOKEN_PROM }}
          DSBUILDER_METRICA_MCP_TOKEN: ${{ secrets.DSBUILDER_METRICA_MCP_TOKEN_PROM }}
          DSBUILDER_ANALYTICS_DISABLED: '1'
          WEB_COUNTER_DEV: ${{ vars.VITE_METRICA_COUNTER_ID_DEV }}
          WEB_COUNTER_PROM: ${{ vars.VITE_METRICA_COUNTER_ID_PROM }}
        run: |
          if [[ "$DSBUILDER_ANALYTICS_ENABLED" == true && ( ! "$DSBUILDER_METRICA_COUNTER_ID" =~ ^[1-9][0-9]*$ || "$DSBUILDER_METRICA_COUNTER_ID" == "$WEB_COUNTER_DEV" || "$DSBUILDER_METRICA_COUNTER_ID" == "$WEB_COUNTER_PROM" ) ]]; then
            echo 'CLI/MCP analytics requires an isolated positive counter distinct from web' >&2
            exit 1
          fi
          ./gradlew :cli:distributionTests :cli:jvmTest :cli:packageJvmCli :cli:packageMacosArm64Cli :cli:packageMacosX64Cli :cli:packageWindowsX64Cli :cli:npmPackCliNodeSmoke -PbundleIosCli=true
          python3 cli/distribution/release.py validate --tag "$CLI_RELEASE_TAG" --directory cli/build/distributions
      - uses: actions/upload-artifact@v4
        with:
          name: cli-distributions
          path: |
            frontend-kt/cli/build/distributions/dsbuilder-cli-*.zip
            frontend-kt/cli/build/distributions/dsbuilder-cli-node.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cli-release-tools
          path: frontend-kt/cli/distribution/
          if-no-files-found: error

  smoke:
    env:
      DSBUILDER_ANALYTICS_DISABLED: '1'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-2022
            target: windows-x64
          - os: ubuntu-22.04
            target: jvm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.target == 'windows-x64'
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cli-distributions
          path: archives
      - uses: actions/download-artifact@v4
        with:
          name: cli-release-tools
          path: release-tools
      - name: Windows installer contract tests
        if: matrix.target == 'windows-x64'
        shell: powershell
        run: ./release-tools/tests/install-windows.Tests.ps1
      - uses: actions/setup-java@v4
        if: matrix.target == 'jvm' || matrix.target == 'windows-x64'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        if: matrix.target == 'windows-x64'
        with:
          node-version: '22.20.0'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.target == 'windows-x64'
      - name: Test JVM Windows process ownership
        if: matrix.target == 'windows-x64'
        shell: bash
        working-directory: frontend-kt
        run: DSBUILDER_TEST_NODE="$(node -p 'process.execPath')" ./gradlew :cli:jvmIntegrationTest --tests '*JvmWindowsProcessRunnerTest'
      - name: Test native and Node Windows processes
        if: matrix.target == 'windows-x64'
        shell: bash
        working-directory: frontend-kt
        run: ./gradlew :cli:mingwX64Test :runtime-node:jsNodeTest :cli:jsNodeTest
      - name: Install and smoke test on Unix
        if: matrix.target != 'windows-x64'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          unzip -q "archives/dsbuilder-cli-$TARGET.zip" -d extracted
          export DSBUILDER_INSTALL_DIR="$RUNNER_TEMP/CLI install"
          export DSBUILDER_BIN_DIR="$RUNNER_TEMP/CLI bin"
          export HOME="$RUNNER_TEMP/CLI home"
          mkdir -p "$HOME"
          installer=$(find extracted -name install.sh -type f)
          sh "$installer" --without-web
          sh "$installer" --without-web
          "$DSBUILDER_BIN_DIR/dsbuilder" --help
          test "$("$DSBUILDER_BIN_DIR/dsbuilder" --version)" = "dsbuilder version ${CLI_RELEASE_TAG#cli-v}"
          if [ "$TARGET" = macos-arm64 ]; then
            test -x "$HOME/.dsbuilder/toolchains/ios/current/dsbuilder-ios"
            "$HOME/.dsbuilder/toolchains/ios/current/dsbuilder-ios" --version
          fi
      - name: Install and smoke test on Windows
        if: matrix.target == 'windows-x64'
        shell: powershell
        run: |
          Expand-Archive archives/dsbuilder-cli-windows-x64.zip extracted
          $env:DSBUILDER_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'CLI install'
          $installer = 'extracted/dsbuilder-cli-windows-x64/install.ps1'
          & $installer -WithoutWeb
          & $installer -WithoutWeb
          $binary = Join-Path $env:DSBUILDER_INSTALL_DIR 'dsbuilder.exe'
          & $binary --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI help failed' }
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "dsbuilder version $($env:CLI_RELEASE_TAG.Substring(5))") { throw 'CLI version mismatch' }
          python release-tools/tests/windows_console_smoke.py $binary
          if ($LASTEXITCODE -ne 0) { throw 'CLI console cancellation failed' }

  node-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
        node: ['22.20.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-distributions
          path: distributions
      - uses: actions/download-artifact@v4
        with:
          name: cli-release-tools
          path: release-tools
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install and check the exact CLI tarball
        run: node release-tools/node-package.cjs smoke distributions/dsbuilder-cli-node.tgz


  publish:
    needs: [build, smoke, node-smoke]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Use release tools from the selected tag
        run: cp -R frontend-kt/cli/distribution release-tools
      - uses: actions/download-artifact@v4
        with:
          name: cli-distributions
          path: distributions
      - uses: actions/download-artifact@v4
        with:
          name: cli-npm-generator
          path: npm-artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          registry-url: 'https://registry.npmjs.org'
      - name: Validate both npm publication inputs
        run: |
          (cd npm-artifacts && sha256sum --check generator.sha256)
          python3 release-tools/npm_release.py preflight --kind generator --archive npm-artifacts/dsbuilder-web-generator.tgz --tag "$CLI_RELEASE_TAG"
          python3 release-tools/npm_release.py preflight --kind cli --archive distributions/dsbuilder-cli-node.tgz --tag "$CLI_RELEASE_TAG"
      - name: Prepare and verify GitHub draft or existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 release-tools/release.py prepare --tag "$CLI_RELEASE_TAG" --directory distributions
          python3 release-tools/release.py upload --tag "$CLI_RELEASE_TAG" --directory distributions
      - name: Publish the web generator to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: python3 release-tools/npm_release.py publish --kind generator --archive npm-artifacts/dsbuilder-web-generator.tgz --tag "$CLI_RELEASE_TAG"
      - name: Publish the Node CLI to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: python3 release-tools/npm_release.py publish --kind cli --archive distributions/dsbuilder-cli-node.tgz --tag "$CLI_RELEASE_TAG"
      - name: Verify public installations without registry credentials
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/npm verification"
          : > "$RUNNER_TEMP/anonymous.npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/anonymous.npmrc"
          unset NODE_AUTH_TOKEN NPM_TOKEN
          generator_version=$(python3 release-tools/npm_release.py version --kind generator --archive npm-artifacts/dsbuilder-web-generator.tgz --tag "$CLI_RELEASE_TAG")
          for attempt in 1 2 3 4 5 6; do
            if npm install --global --prefix "$prefix" --ignore-scripts --no-audit --no-fund "@sddsjs/design-system-builder-generator@$generator_version" "@sddsjs/design-system-builder-cli@${CLI_RELEASE_TAG#cli-v}"; then
              break
            fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep "$((2 ** attempt))"
          done
          "$prefix/bin/dsbuilder" --version
          "$prefix/bin/dsbuilder" --help
          "$prefix/bin/dsbuilder-web-generator" --version
          node release-tools/node-package.cjs generator-smoke "$prefix/bin/dsbuilder-web-generator"
      - name: Publish the verified release and advance Latest when newer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release-tools/release.py promote --tag "$CLI_RELEASE_TAG" --directory distributions
