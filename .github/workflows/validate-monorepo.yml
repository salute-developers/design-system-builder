name: Validate monorepo

on:
  pull_request:
    paths:
      - 'js/services/generator/**'
      - 'backend-kt/.env.prod.example'
      - 'backend-kt/docker-compose.prod.yml'
      - '.github/workflows/validate-monorepo.yml'
  push:
    branches:
      - dev
      - master
    paths:
      - 'js/services/generator/**'
      - 'backend-kt/.env.prod.example'
      - 'backend-kt/docker-compose.prod.yml'
      - '.github/workflows/validate-monorepo.yml'

jobs:
  generator:
    name: Generator
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: js/services/generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: js/services/generator/.nvmrc
          cache: npm
          cache-dependency-path: js/services/generator/package-lock.json
      - run: npm ci --no-progress
      - run: npm run build

  production-compose:
    name: Production Compose
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker compose
          --env-file backend-kt/.env.prod.example
          -f backend-kt/docker-compose.prod.yml
          config --quiet
