name: Deploy front apps to DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/prepare-environment

      - name: Prepare directory build
        run: mkdir -p s3_build

      # TODO: https://github.com/salute-developers/plasma/issues/255
      - name: Npm install
        run: |
          npm install --prefix="./apps/client"

      - name: Build client
        env:
          OTHER_WEB_COUNTER: ${{ vars.VITE_METRICA_COUNTER_ID_PROM }}
          CLI_COUNTER_PROM: ${{ vars.DSBUILDER_METRICA_COUNTER_ID_PROM }}
          VITE_METRICA_ENABLED: ${{ vars.VITE_METRICA_ENABLED_DEV || 'false' }}
          VITE_METRICA_COUNTER_ID: ${{ vars.VITE_METRICA_COUNTER_ID_DEV }}
          VITE_API_GATEWAY_URL: ${{ vars.VITE_API_GATEWAY_URL_DEV }}
          VITE_CLIENT_ID: ${{ vars.VITE_CLIENT_ID_DEV }}
          VITE_REQUEST_ACCESS_URL: ${{ vars.VITE_REQUEST_ACCESS_URL_DEV }}
          VITE_COMPONENT_EDITOR_ENABLED: 'true'
          BASE_URL: '/dev/design-system-builder/client/'
        run: |
          export NODE_OPTIONS=--openssl-legacy-provider
          if [[ "$VITE_METRICA_ENABLED" == true ]]; then
            if [[ ! "$VITE_METRICA_COUNTER_ID" =~ ^[1-9][0-9]*$ || "$VITE_METRICA_COUNTER_ID" == "$OTHER_WEB_COUNTER" || "$VITE_METRICA_COUNTER_ID" == "$CLI_COUNTER_PROM" ]]; then
              echo 'Analytics requires an isolated positive web counter' >&2
              exit 1
            fi
          fi
          npm run build --prefix="./apps/client"
          cp -R ./apps/client/dist ./s3_build/client

      - name: Install s3cmd
        run: |
          pip3 install s3cmd

      - name: s3 Upload client build
        run: >
          s3cmd
          --access_key ${{ secrets.AWS_ACCESS_KEY_ID }}
          --secret_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          --host ${{ secrets.AWS_ENDPOINT }}
          --host-bucket ${{ secrets.AWS_ENDPOINT }}
          --bucket-location ${{ secrets.AWS_REGION }}
          --signature-v2
          --delete-removed
          --no-mime-magic
          sync
          ./s3_build/client/
          s3://${{ secrets.AWS_S3_BUCKET_2 }}/dev/design-system-builder/client/
