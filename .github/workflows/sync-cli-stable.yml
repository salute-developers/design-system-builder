name: Sync CLI stable

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-cli-release
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    env:
      AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
      AWS_S3_BUCKET_2: ${{ secrets.AWS_S3_BUCKET_2 }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      CLI_S3_PREFIX: ${{ vars.CLI_S3_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - run: python3 -m pip install s3cmd==2.4.0
      - name: Point stable at the complete release selected in Git
        run: python3 frontend-kt/cli/distribution/release.py sync-stable --stable-file frontend-kt/cli/distribution/stable.json
