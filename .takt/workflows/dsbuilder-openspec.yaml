name: dsbuilder-openspec
description: Implement an approved OpenSpec change and archive it after conformance review.
max_steps: 20
initial_step: apply
steps:
  - name: apply
    persona: coder
    edit: true
    required_permission_mode: edit
    instruction: |
      Implement the approved OpenSpec change named in the task. Before editing
      code, read its proposal.md, design.md, spec deltas, and tasks.md, plus
      AGENTS.md and relevant repository architecture documents.

      Before acting, check for
      `.takt/orchestration/<change-name>/resume.md`, where `<change-name>` is the
      OpenSpec Change named in the task. If present, treat it as the latest
      developer-approved handoff from the coordinating agent. It may contain an
      answer to a clarification or the result of a specific external check. It
      does not grant additional sandbox permissions.

      Treat the approved OpenSpec Change as the implementation contract. Complete
      its unchecked tasks in dependency order and update task checkboxes as work
      is completed. Implement the tests already required by the Change. You may
      decide local implementation details, but do not silently change product
      behavior, architecture boundaries, public contracts, data flow, state
      transitions, or other approved design decisions.

      Do not modify files under backend-kt/architecture-tests or
      frontend-kt/architecture-tests unless the approved OpenSpec Change makes
      architecture tests part of its scope or the task explicitly states that
      the developer authorized those changes. Never weaken, delete, exclude, or
      rewrite an architecture rule merely to make verification pass.

      If a material design assumption is invalid or the Change is incomplete or
      contradictory, do not invent a replacement design. Stop and explain exactly
      what must be updated in OpenSpec and reviewed by a human. Do not commit,
      push, archive the Change, or create a PR.
    quality_gates:
      - type: command
        name: fast-verification
        command: "./tools/verify fast"
        cwd: "."
        timeout_ms: 1200000
    rules:
      - condition: All OpenSpec implementation tasks completed
        next: conformance_review
      - condition: OpenSpec requires a material design decision or revision
        next: ABORT
        command_gates: skip
      - condition: OpenSpec artifacts are missing or contradictory
        next: ABORT
        command_gates: skip

  - name: conformance_review
    persona: coding-reviewer
    edit: false
    instruction: |
      Review the implementation only for conformance with the approved OpenSpec
      Change named in the task. Read proposal.md, design.md, spec deltas, and
      tasks.md. Check that required behavior and tasks are implemented, the code
      follows approved component boundaries and contracts, and no unapproved
      product or architecture decisions were introduced.

      Treat every architecture-test change as a conformance finding unless it is
      explicitly authorized by the approved OpenSpec Change or by the developer
      in the task. Check that authorized changes preserve or strengthen the
      intended architecture rules rather than masking implementation violations.

      Return concrete findings with file locations and the violated OpenSpec
      requirement or design decision. Do not edit files. If fixing a finding
      requires a material change to the approved design, request an OpenSpec
      revision and human review instead of approving an improvised solution.

      Before reviewing, read
      `.takt/orchestration/<change-name>/resume.md` when it exists. Use it only
      as the latest developer-approved clarification or external verification
      result; it does not grant additional sandbox permissions. If work is
      blocked, return the exact question or external action needed.
    rules:
      - condition: Implementation conforms to the approved OpenSpec Change
        next: full_verification
      - condition: Implementation has fixable conformance findings
        next: fix
      - condition: A material OpenSpec revision is required
        next: ABORT

  - name: fix
    persona: coder
    edit: true
    required_permission_mode: edit
    instruction: |
      Fix the conformance review findings within the approved OpenSpec scope.
      Update task checkboxes when their work is actually complete. Do not expand
      or rewrite the approved design. If a finding cannot be fixed without a
      material OpenSpec change, stop and request OpenSpec revision and human
      review. Do not commit, push, archive the Change, or create a PR.

      Do not change architecture tests unless that work is explicitly authorized
      by the approved OpenSpec Change or by the developer in the task. Fix the
      implementation instead of weakening an architecture test.

      Read `.takt/orchestration/<change-name>/resume.md` when it exists and apply
      its latest developer-approved clarification or external check result. The
      handoff does not expand sandbox permissions. If still blocked, return the
      exact question or external action needed.
    quality_gates:
      - type: command
        name: fast-verification
        command: "./tools/verify fast"
        cwd: "."
        timeout_ms: 1200000
    rules:
      - condition: Conformance findings fixed within approved design
        next: conformance_review
      - condition: A material OpenSpec revision is required
        next: ABORT
        command_gates: skip

  - name: full_verification
    persona: coding-reviewer
    edit: false
    instruction: |
      Run `./tools/verify full` and inspect its complete output. Verify that the
      deterministic FULL gate, including a detailed Strictacode audit and compare
      against the versioned baseline, passes for every changed repository contour.
      Do not edit files or update the Strictacode baseline. If a failure is caused
      by the implementation and can be fixed within the approved design, report
      the exact failing command and route it to fix. If resolving it requires a
      material design change, request an OpenSpec revision. Classify a failure as
      pre-existing or environmental only when the command output proves that
      classification.

      Before verification, read
      `.takt/orchestration/<change-name>/resume.md` when it exists. A reported
      external check result is evidence to inspect, not permission to perform
      additional privileged actions. If verification remains blocked, return
      the exact command, question, or external action needed.
    quality_gates:
      - type: command
        name: full-verification
        command: "./tools/verify full"
        cwd: "."
        timeout_ms: 1800000
    rules:
      - condition: FULL verification passes for all changed contours
        next: archive
      - condition: FULL verification has implementation failures fixable within approved design
        next: fix
        command_gates: skip
      - condition: FULL verification requires a material OpenSpec revision
        next: ABORT
        command_gates: skip
      - condition: FULL verification is blocked by a proven environment or pre-existing failure
        next: ABORT
        command_gates: skip

  - name: archive
    persona: coder
    edit: true
    required_permission_mode: edit
    instruction: |
      Archive only the implemented OpenSpec change named in the task using the
      repository's OpenSpec CLI. Confirm that all tasks are complete and inspect
      the resulting main-spec changes for consistency with the approved Change.
      Run strict OpenSpec validation for the resulting affected specifications.
      Do not commit, push, or create a PR; the coordinating agent handles those
      actions after the workflow completes.

      Read `.takt/orchestration/<change-name>/resume.md` when it exists before
      archiving. Apply only clarifications relevant to the approved Change. If
      archiving remains blocked, return the exact question or external action
      needed.
    rules:
      - condition: OpenSpec Change archived successfully
        next: COMPLETE
      - condition: Change cannot be archived consistently
        next: ABORT
