x-keycloak-runtime-env: &keycloak-runtime-env
  KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN}
  KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
  KC_DB: ${KC_DB:?Set KC_DB}
  KC_DB_URL_HOST: ${KC_DB_URL_HOST:?Set KC_DB_URL_HOST}
  KC_DB_URL_PORT: ${KC_DB_URL_PORT:?Set KC_DB_URL_PORT}
  KC_DB_URL_DATABASE: ${KEYCLOAK_POSTGRES_DB:?Set KEYCLOAK_POSTGRES_DB}
  KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER:?Set KEYCLOAK_POSTGRES_USER}
  KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:?Set KEYCLOAK_POSTGRES_PASSWORD}
  KC_HEALTH_ENABLED: ${KC_HEALTH_ENABLED:-true}
  KC_METRICS_ENABLED: ${KC_METRICS_ENABLED:-true}
  KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
  KC_HOSTNAME: ${KC_HOSTNAME:?Set KC_HOSTNAME}
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:?Set KEYCLOAK_REALM}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID}
  OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?Set OIDC_REDIRECT_URI}
  OIDC_WEB_ORIGIN: ${OIDC_WEB_ORIGIN:?Set OIDC_WEB_ORIGIN}
  KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:?Set KEYCLOAK_ISSUER}
  KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:?Set KEYCLOAK_AUDIENCE}
  KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:?Set KEYCLOAK_JWKS_URL}
  KEYCLOAK_BOOTSTRAP_URL: ${KEYCLOAK_BOOTSTRAP_URL:?Set KEYCLOAK_BOOTSTRAP_URL}
  KEYCLOAK_UPSTREAM_HOST: ${KEYCLOAK_UPSTREAM_HOST:?Set KEYCLOAK_UPSTREAM_HOST}
  KEYCLOAK_UPSTREAM_PORT: ${KEYCLOAK_UPSTREAM_PORT:?Set KEYCLOAK_UPSTREAM_PORT}

x-projects-runtime-env: &projects-runtime-env
  PROJECTS_INTERNAL_API_KEY: ${PROJECTS_INTERNAL_API_KEY:?Set PROJECTS_INTERNAL_API_KEY}
  PROJECTS_ACCESS_KEYS_PREFIX: ${PROJECTS_ACCESS_KEYS_PREFIX:-dsb_pk}
  PROJECTS_ACCESS_KEYS_DEFAULT_TTL_MS: ${PROJECTS_ACCESS_KEYS_DEFAULT_TTL_MS:-2592000000}
  PROJECTS_ACCESS_KEYS_SECRET_BYTE_LENGTH: ${PROJECTS_ACCESS_KEYS_SECRET_BYTE_LENGTH:-32}
  PROJECTS_ACCESS_KEYS_HASH_ITERATIONS: ${PROJECTS_ACCESS_KEYS_HASH_ITERATIONS:-120000}
  PROJECTS_ACCESS_KEYS_HASH_KEY_LENGTH_BITS: ${PROJECTS_ACCESS_KEYS_HASH_KEY_LENGTH_BITS:-256}
  PROJECTS_ACCESS_KEYS_HASH_SALT_BYTE_LENGTH: ${PROJECTS_ACCESS_KEYS_HASH_SALT_BYTE_LENGTH:-16}
  PROJECTS_SERVICE_PORT: ${PROJECTS_SERVICE_PORT:-8082}
  PROJECTS_DATABASE_URL: ${PROJECTS_DATABASE_URL:?Set PROJECTS_DATABASE_URL}
  PROJECTS_POSTGRES_USER: ${PROJECTS_POSTGRES_USER:?Set PROJECTS_POSTGRES_USER}
  PROJECTS_POSTGRES_PASSWORD: ${PROJECTS_POSTGRES_PASSWORD:?Set PROJECTS_POSTGRES_PASSWORD}
  PROJECTS_IDENTITY_KEYCLOAK_BASE_URL: ${PROJECTS_IDENTITY_KEYCLOAK_BASE_URL:?Set PROJECTS_IDENTITY_KEYCLOAK_BASE_URL}
  PROJECTS_IDENTITY_KEYCLOAK_REALM: ${PROJECTS_IDENTITY_KEYCLOAK_REALM:?Set PROJECTS_IDENTITY_KEYCLOAK_REALM}
  PROJECTS_IDENTITY_KEYCLOAK_CLIENT_ID: ${PROJECTS_IDENTITY_KEYCLOAK_CLIENT_ID:?Set PROJECTS_IDENTITY_KEYCLOAK_CLIENT_ID}
  PROJECTS_IDENTITY_KEYCLOAK_CLIENT_SECRET: ${PROJECTS_IDENTITY_KEYCLOAK_CLIENT_SECRET:?Set PROJECTS_IDENTITY_KEYCLOAK_CLIENT_SECRET}
  PROJECTS_IDENTITY_KEYCLOAK_TIMEOUT_MS: ${PROJECTS_IDENTITY_KEYCLOAK_TIMEOUT_MS:-1500}

x-auth-helper-runtime-env: &auth-helper-runtime-env
  AUTH_HELPER_PORT: 8091
  PROJECT_ACCESS_MODE: ${PROJECT_ACCESS_MODE:-http}
  PROJECT_ACCESS_DEFAULT_ROLE: ${PROJECT_ACCESS_DEFAULT_ROLE:-viewer}
  PROJECT_ACCESS_TIMEOUT_MS: ${PROJECT_ACCESS_TIMEOUT_MS:-1500}
  PROJECTS_SERVICE_URL: http://projects-service:8082

services:
  keycloak:
    build:
      context: .
      dockerfile: ./identity-gateway/keycloak/Dockerfile
    restart: unless-stopped
    environment:
      <<: *keycloak-runtime-env
    command:
      - start
      - --import-realm
      - --http-enabled=true
      - --http-port=8080
    ports:
      - "${KEYCLOAK_ADMIN_BIND:-127.0.0.1}:${KEYCLOAK_ADMIN_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3; grep -q '200' <&3"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 10

  keycloak-bootstrap:
    build:
      context: .
      dockerfile: ./identity-gateway/keycloak/Dockerfile.bootstrap
    restart: "no"
    environment:
      <<: [*keycloak-runtime-env, *projects-runtime-env]
    entrypoint:
      - /bin/sh
      - /opt/keycloak/bootstrap/bootstrap-production-keycloak.sh
    depends_on:
      keycloak:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: ./identity-gateway/gateway/Dockerfile
    restart: unless-stopped
    environment:
      <<: *keycloak-runtime-env
      DB_SERVICE_UPSTREAM_SCHEME: ${DB_SERVICE_UPSTREAM_SCHEME:-http}
      DB_SERVICE_UPSTREAM_HOST: ${DB_SERVICE_UPSTREAM_HOST:?Set DB_SERVICE_UPSTREAM_HOST}
      DB_SERVICE_UPSTREAM_PORT: ${DB_SERVICE_UPSTREAM_PORT:?Set DB_SERVICE_UPSTREAM_PORT}
      DOCS_SERVICE_UPSTREAM_SCHEME: ${DOCS_SERVICE_UPSTREAM_SCHEME:-http}
      DOCS_SERVICE_UPSTREAM_HOST: ${DOCS_SERVICE_UPSTREAM_HOST:?Set DOCS_SERVICE_UPSTREAM_HOST}
      DOCS_SERVICE_UPSTREAM_PORT: ${DOCS_SERVICE_UPSTREAM_PORT:?Set DOCS_SERVICE_UPSTREAM_PORT}
      GENERATOR_SERVICE_UPSTREAM_SCHEME: ${GENERATOR_SERVICE_UPSTREAM_SCHEME:-http}
      GENERATOR_SERVICE_UPSTREAM_HOST: ${GENERATOR_SERVICE_UPSTREAM_HOST:?Set GENERATOR_SERVICE_UPSTREAM_HOST}
      GENERATOR_SERVICE_UPSTREAM_PORT: ${GENERATOR_SERVICE_UPSTREAM_PORT:?Set GENERATOR_SERVICE_UPSTREAM_PORT}
      PUBLISHER_SERVICE_UPSTREAM_SCHEME: ${PUBLISHER_SERVICE_UPSTREAM_SCHEME:-http}
      PUBLISHER_SERVICE_UPSTREAM_HOST: ${PUBLISHER_SERVICE_UPSTREAM_HOST:?Set PUBLISHER_SERVICE_UPSTREAM_HOST}
      PUBLISHER_SERVICE_UPSTREAM_PORT: ${PUBLISHER_SERVICE_UPSTREAM_PORT:?Set PUBLISHER_SERVICE_UPSTREAM_PORT}
      GATEWAY_PROXY_TIMEOUT_SECONDS: ${GATEWAY_PROXY_TIMEOUT_SECONDS:-300}
    command:
      - /bin/sh
      - -c
      - envsubst '$$KEYCLOAK_UPSTREAM_HOST $$KEYCLOAK_UPSTREAM_PORT $$KEYCLOAK_REALM $$OIDC_CLIENT_ID $$OIDC_REDIRECT_URI $$OIDC_WEB_ORIGIN $$DB_SERVICE_UPSTREAM_SCHEME $$DB_SERVICE_UPSTREAM_HOST $$DB_SERVICE_UPSTREAM_PORT $$DOCS_SERVICE_UPSTREAM_SCHEME $$DOCS_SERVICE_UPSTREAM_HOST $$DOCS_SERVICE_UPSTREAM_PORT $$GENERATOR_SERVICE_UPSTREAM_SCHEME $$GENERATOR_SERVICE_UPSTREAM_HOST $$GENERATOR_SERVICE_UPSTREAM_PORT $$PUBLISHER_SERVICE_UPSTREAM_SCHEME $$PUBLISHER_SERVICE_UPSTREAM_HOST $$PUBLISHER_SERVICE_UPSTREAM_PORT $$GATEWAY_PROXY_TIMEOUT_SECONDS' < /etc/nginx/templates/nginx.prod.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak-bootstrap:
        condition: service_completed_successfully
      auth-helper:
        condition: service_healthy
      projects-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  auth-helper:
    build:
      context: .
      dockerfile: ./identity-gateway/app/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*keycloak-runtime-env, *projects-runtime-env, *auth-helper-runtime-env]
    expose:
      - "8091"
    depends_on:
      keycloak-bootstrap:
        condition: service_completed_successfully
      projects-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  projects-service:
    build:
      context: .
      dockerfile: ./projects-service/app/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*keycloak-runtime-env, *projects-runtime-env]
    expose:
      - "8082"
    depends_on:
      keycloak-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
